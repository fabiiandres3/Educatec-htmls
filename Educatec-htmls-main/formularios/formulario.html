<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | EducaTec</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONOS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/style/style_formulario.css">

</head>

<body>

    <!-- OVERLAY -->
    <div class="overlay"></div>

    <!-- LOGIN -->
    <div class="login-container">

        <!-- LOGO -->
        <img src="../img/logo2.png" alt="Logo EducaTec" class="logo">

        <h2>Bienvenido</h2>

        <p class="subtitle">
            Accede al portal académico de EducaTec
        </p>

        <!-- FORM -->
        <form id="loginForm">

            <!-- CORREO -->
            <label for="correo">
                Correo electrónico
            </label>

            <div class="input-group-custom">

                <i class="bi bi-envelope-fill"></i>

                <input 
                    type="email"
                    id="correo"
                    placeholder="ejemplo@educatec.com"
                    required
                >

            </div>

            <!-- CONTRASEÑA -->
            <label for="contrasena">
                Contraseña
            </label>

            <div class="input-group-custom">

                <i class="bi bi-lock-fill"></i>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="Ingrese su contraseña"
                    required
                >

            </div>

            <!-- ROL -->
            <label for="rol">
                Seleccione su rol
            </label>

            <div class="input-group-custom">

                <i class="bi bi-person-badge-fill"></i>

                <select id="rol" required>

                    <option value="">
                        Seleccione
                    </option>

                    <option value="../alumno/alumno_dashboard.html">
                        Estudiante
                    </option>

                    <option value="../docente/docente_dashboard.html">
                        Docente
                    </option>

                    <option value="../admin/admin_dashboard.html">
                        Administrador
                    </option>

                </select>

            </div>

            <!-- BOTON -->
            <button type="submit" class="btn-login">

                <i class="bi bi-box-arrow-in-right"></i>
                Ingresar

            </button>

        </form>

        <!-- EXTRA -->
        <div class="extra">

            <p>
                <a href="../index.html">
                    ← Volver al inicio
                </a>
            </p>

            <p>
                <a href="../formularios/formulario_olvido_contraseña.html">
                    ¿Olvidó su contraseña?
                </a>
            </p>

        </div>

    </div>

    <!-- SCRIPT -->
    <script>

        document
        .getElementById("loginForm")
        .addEventListener("submit", function(e){

            e.preventDefault();

            let rol =
            document
            .getElementById("rol")
            .value;

            if(rol !== ""){

                window.location.href = rol;

            }else{

                alert("Seleccione un rol");

            }

        });

    </script>

</body>
</html>
