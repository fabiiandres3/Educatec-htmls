<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Contenido | EducaTec</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICONOS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../style/style_form_contenido.css">

</head>

<body>

    <!-- BACKGROUND GLOW -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

            <div class="logo-area">

                <img src="../img/logo2.png" alt="EducaTec">

                <h2>EducaTec</h2>

            </div>

            <div class="sidebar-info">

                <div class="info-card">

                    <i class="bi bi-file-earmark-richtext-fill"></i>

                    <div>

                        <h4>Contenido Académico</h4>

                        <p>
                            Gestiona material educativo digital.
                        </p>

                    </div>

                </div>

                <div class="status-pill">

                    <i class="bi bi-check-circle-fill"></i>
                    Plataforma activa

                </div>

            </div>

        </div>

        <a href="../admin/admin_dashboard.html" class="back-btn">

            <i class="bi bi-arrow-left"></i>
            Volver al Panel

        </a>

    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <!-- HEADER -->
        <div class="top-header">

            <div>

                <h1>Registro de Contenido</h1>

                <p>
                    Publica material académico moderno para los estudiantes.
                </p>

            </div>

            <div class="admin-profile">

                <i class="bi bi-person-circle"></i>

                <span>Administrador</span>

            </div>

        </div>

        <!-- FORM -->
        <form
            action="../actividades/contenido_guardado.html"
            method="POST"
            enctype="multipart/form-data"
            class="content-form"
        >

            <!-- GRID -->
            <div class="form-grid">

                <!-- TITULO -->
                <div class="form-card">

                    <h3>
                        <i class="bi bi-type"></i>
                        Información General
                    </h3>

                    <div class="form-group">

                        <label>Título</label>

                        <input
                            type="text"
                            name="titulo"
                            placeholder="Ej: Guía de sintaxis"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Descripción</label>

                        <textarea
                            name="descripcion"
                            placeholder="Describe el contenido..."
                        ></textarea>

                    </div>

                </div>

                <!-- TIPO -->
                <div class="form-card">

                    <h3>
                        <i class="bi bi-diagram-3-fill"></i>
                        Configuración
                    </h3>

                    <div class="form-group">

                        <label>Tipo de contenido</label>

                        <select name="tipo" required>

                            <option disabled selected>
                                Seleccionar...
                            </option>

                            <option value="video">
                                Video
                            </option>

                            <option value="pdf">
                                PDF
                            </option>

                            <option value="imagen">
                                Imagen
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Fecha</label>

                        <input
                            type="date"
                            name="fecha"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Módulo</label>

                        <select name="modulo" required>

                            <option disabled selected>
                                Seleccionar módulo...
                            </option>

                            <option>
                                Módulo 1: Introducción
                            </option>

                            <option>
                                Módulo 2: Teorema de Pitágoras
                            </option>

                            <option>
                                Módulo 3: Catetos
                            </option>

                        </select>

                    </div>

                </div>

                <!-- UPLOAD -->
                <div class="form-card full-width">

                    <h3>
                        <i class="bi bi-cloud-arrow-up-fill"></i>
                        Subir Archivo
                    </h3>

                    <label class="upload-area">

                        <input
                            type="file"
                            name="archivo"
                            required
                        >

                        <i class="bi bi-cloud-upload-fill"></i>

                        <h4>
                            Arrastra archivos aquí
                        </h4>

                        <p>
                            o haz clic para seleccionar
                        </p>

                    </label>

                </div>

                <!-- CHECK -->
                <div class="form-card full-width">

                    <div class="checkbox-area">

                        <label>

                            <input
                                type="checkbox"
                                name="revisado"
                            >

                            Contenido revisado y aprobado

                        </label>

                    </div>

                </div>

            </div>

            <!-- BOTON -->
            <button type="submit" class="submit-btn">

                <i class="bi bi-save-fill"></i>
                Guardar Contenido

            </button>

        </form>

    </main>

</body>

</html>
